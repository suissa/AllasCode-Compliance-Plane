version: "1.0.0"
catalog: allascode-compliance-plane
definitions_file: catalog/compliance-definitions.json
jurisdiction: BR
scope:
  company_profiles: [MEI, ME]
  note: "Baseline horizontal; ativar regras condicionais após avaliação de aplicabilidade."
execution_points: [on_ingress, before_egress, between_agents, between_actions, scheduled, on_state_change]
result_states: [compliant, non_compliant, indeterminate, not_applicable]
enforcement_modes: [block, quarantine, warn, audit_only]
precedence: [operation_override, action_policy, agent_policy, intent_policy, company_default]
defaults:
  execution:
    on_ingress: true
    before_egress: true
    between_agents: true
    between_actions: true
    scheduled: false
    on_state_change: true
  enforcement: audit_only
  evidence_required: true
  fail_closed_for: [personal_data_export, payment, tax_filing, credential_change]
  human_review_for: [ambiguous_legal_rule, high_impact_decision, exception_request]
